name: royal-apart-app

services:
  api:
    build:
      context: ./server
      target: production
    environment:
      - MONGOPASS=${MONGOPASS}
      - LGTOKEN=${LGTOKEN}
      - PSTOKEN=${PSTOKEN}
      - WUDOO_API_KEY=${WUDOO_API_KEY}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_AUTH_ENFORCE=${ADMIN_AUTH_ENFORCE:-false}
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - royal-apart-app
    restart: unless-stopped

  web:
    build:
      context: ./siteRoyal
      target: production
    networks:
      - royal-apart-app
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27.4-alpine
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
#      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - royal-apart-app
    depends_on:
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      certonly --webroot -w /var/www/certbot
      --force-renewal
      --email ${CERT_EMAIL}
      -d ${DOMAIN}
      -d www.${DOMAIN}
      --agree-tos
      --non-interactive
    networks:
      - royal-apart-app
    depends_on:
      - nginx

  tgbot:
    build:
      context: ./telegram bot
    environment:
      - token=${TG_BOT_TOKEN}
      - ADMIN_PHONES=${ADMIN_PHONES:-+380983405578}
      - WUBOOK_WEBHOOK_SECRET=${WUBOOK_WEBHOOK_SECRET}
      - WUBOOK_PROPERTY_ID=${WUBOOK_PROPERTY_ID}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ML_RESULTS_FILE=/ml-data/price_check.json
    expose:
      - "3001"
    volumes:
      - ./telegram bot:/app
      - /app/node_modules
      - ./ml-data:/ml-data:ro
    networks:
      - royal-apart-app
    depends_on:
      - api
    restart: unless-stopped

  # Daily ML price check (python/ml_price_check.py) -> ./ml-data/price_check.json for the bot
  ml:
    build:
      context: ./python
    environment:
      - API_URL=http://api:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ML_OUTPUT=/ml-data/price_check.json
      - ML_FORECAST_OUTPUT=/ml-data/forecast.json
      - ML_RUN_HOUR=9
    volumes:
      - ./server/data2025:/server/data2025:ro
      - ./ml-data:/ml-data
    mem_limit: 1g
    networks:
      - royal-apart-app
    depends_on:
      - api
    restart: unless-stopped

networks:
  royal-apart-app:
    driver: bridge