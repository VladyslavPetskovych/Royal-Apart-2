on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-22.04
    
    steps:
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: connect and deploy with safe cleanup
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd ${{ secrets.WORK_DIR }}
            echo "🔄 Updating code..."
            git checkout ${{ secrets.MAIN_BRANCH }}
            # fails (and keeps the running version up) if the server has local changes
            git pull --ff-only
            # rebuilds and recreates only changed services, no full shutdown
            docker compose up -d --build --remove-orphans
            # nginx renders its template only on start: re-render, test, and reload without downtime
            # (if the test fails, the old config keeps serving and the deploy is marked failed)
            docker compose exec -T nginx sh -c "/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t && nginx -s reload"
            docker compose ps
            set +e

            echo "📊 Checking disk usage..."
            USED=$(df -h / | tail -1 | awk "{print \$5}" | tr -d "%")
            echo "Disk usage: $USED%"

            if [ "$USED" -ge 80 ]; then
              echo "⚠️ Disk usage is over 80%. Running cleanup..."

              docker image prune -af
              docker container prune -f
              docker builder prune -af

              echo "🧹 Pruning volumes except mongo_data and redis_data..."
              docker volume ls -qf dangling=true | grep -v -E "^(royal-apart-app_mongo_data)$" | xargs -r docker volume rm

            else
              echo "✅ Disk usage under control. No cleanup needed."
            fi
          '

      - name: cleanup
        run: rm -rf ~/.ssh